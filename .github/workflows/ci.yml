name: CI

# Fast, non-visual checks (Chromatic runs separately in chromatic.yml).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Token a11y gate
        run: pnpm --filter @ds/tokens tokens:a11y
      - name: Typecheck UI
        run: pnpm --filter @ds/ui typecheck
      - name: Styles export smoke test
        run: pnpm --filter @ds/ui check:styles
